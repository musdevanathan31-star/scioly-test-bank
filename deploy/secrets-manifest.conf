# The secrets a new host needs and no backup contains.
#
# Read by deploy/migrate-secrets.sh (--check / --export / --import).
#
# Why this file exists: backup-extracted-data.sh and backup-bulk-data.sh
# both deliberately exclude everything below (see README's "Backups") --
# they are unattended pipelines writing to GitHub and S3, and these files
# are too sensitive for that. The consequence is that a restore from those
# backups produces a host with all its data and none of its identity: it
# will not start, or it starts and logs everyone out. This is the list that
# closes that gap, in one place, instead of scattered across the docs.
#
# FORMAT
#   file:<scope>:<path>:<owner>:<mode>:<description>
#   optional:<scope>:<path>:<owner>:<mode>:<description>
#   note:<description>
#
#   scope     instance  -> expanded once per row in instances.conf
#             global    -> expanded once
#   file      must exist; --check fails if it does not
#   optional  may be absent (not every instance has every one); --check
#             reports it and moves on
#   note      not a file at all -- something that lives only in a password
#             manager or another system. Printed by --check so the
#             inventory is complete even where a script cannot act.
#
#   Path/owner placeholders, per instance:
#     {root}       instance root, e.g. /opt/qbank   (dirname of app_dir)
#     {app_dir}    e.g. /opt/qbank/app
#     {data_root}  DATA_ROOT from {root}/.env, falling back to {app_dir}
#     {user}       the instance's system user, e.g. qbank
#
#   Descriptions may contain colons; only the first five fields are split.

# --- per instance -----------------------------------------------------------

file:instance:{root}/.env:{user}:600:FLASK_SECRET_KEY (sessions survive restarts), ANTHROPIC_API_KEY, APPLICATION_ROOT, DATA_ROOT, SESSION_COOKIE_SECURE

# Follows DATA_ROOT, not the app dir -- auth.py:40 resolves USERS_FILE
# against DATA_ROOT. On a migrated instance this is NOT under {app_dir}.
file:instance:{data_root}/auth_users.json:{user}:600:Every account for this instance: usernames, roles, password hashes

# Deliberately the app dir even when DATA_ROOT is set: download_event.py:35
# resolves COOKIE_FILE against Path(__file__).parent, so this one does not
# move with the data. Worth carrying for continuity, but it expires in about
# a week anyway and the header's Save-cookie box can refresh it.
optional:instance:{app_dir}/.scioly_cookies.json:{user}:600:Cached scioly.org Anubis bypass cookies (~7-day life)

# --- global -----------------------------------------------------------------

file:global:/opt/qbank-admin/.env:qbank-admin:600:ADMIN_PASSWORD_HASH plus the admin app's own FLASK_SECRET_KEY

# Separate from every app .env on purpose so an app-level bug cannot read
# backup-destination credentials. Contains the restic password -- see the
# note below about what losing it costs.
optional:global:/opt/qbank/backup/.env:qbank:600:Backup destinations: GitHub PAT, AWS keys, restic repository password

# --- not files: verify you still have these before decommissioning the old box

note:restic repository password -- if it exists only in /opt/qbank/backup/.env on the old host and that host goes away, every S3 snapshot becomes permanently undecryptable. It belongs in a password manager.
note:GitHub PAT for the private databank repo (also inside backup/.env) -- needed to clone the extracted-data backups onto the new host.
note:AWS access key/secret for the restic S3 bucket (also inside backup/.env).
note:The admin app's password. Its hash moves with /opt/qbank-admin/.env, but the plaintext lives only in your password manager -- and it is currently the same as the RHEL admin password by an earlier deliberate choice, so rotating one means rotating both.
note:Anything set only in a systemd drop-in rather than an .env (e.g. a thread count set through the admin app) is host-local config, not a secret, and is NOT carried by --export. Re-apply it on the new box.
