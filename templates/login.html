<!doctype html>
<html><head><meta charset="utf-8"><link rel="icon" href="{{ url_for('favicon') }}"><link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.png') }}"><title>Sign in · {{ school_name }} Sci-Oly Question Banks</title>
<style>
{{ common_css|safe }}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:var(--bg-card);border:1px solid var(--line);border-radius:10px;
  padding:28px 30px;width:340px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.login-box h1{margin:0 0 18px 0;font-size:17px;text-align:center}
.login-box label{display:block;font-size:13px;margin-bottom:4px;color:var(--fg-soft)}
.login-box input{width:100%;padding:8px 10px;margin-bottom:14px;
  border:1px solid var(--line);border-radius:4px;font:inherit;font-size:14px}
.login-box button{width:100%;padding:9px;font-size:14px}
.login-box .err{color:var(--bad);font-size:13px;margin-bottom:12px;text-align:center}
.login-logo{display:block;margin:0 auto 14px;max-width:230px;width:auto;
  height:auto;max-height:110px}
</style></head>
<body>
<div class="login-box">
  {%- if school_logo %}
  {# width:auto with a capped height scales both axes equally, so the
     wordmark never distorts regardless of the file's own dimensions. #}
  <img src="{{ url_for('static', filename=school_logo) }}"
       alt="{{ school_name }}" class="login-logo">
  {%- endif %}
  <h1>{{ school_name }} Sci-Oly Question Banks</h1>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" autofocus required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="primary">Sign in</button>
  </form>
</div>
</body></html>
