<!doctype html>
<html><head><meta charset="utf-8"><link rel="icon" href="{{ url_for('favicon') }}"><link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.png') }}"><title>Grade · {{ event_name }} · {{ school_name }} Sci-Oly Question Banks</title>
<style>
{{ common_css|safe }}
.wrap{padding:18px;max-width:900px;margin:0 auto}
section{background:var(--bg-card);border:1px solid var(--line);border-radius:6px;
  padding:14px 18px;margin-bottom:14px}
.toggle-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.frq-block{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:12px}
.frq-block h3{margin:0 0 8px 0;font-size:14px}
/* Read-only sibling of .frq-block for every auto-graded question -- a
   coach reviewing a submission needs to see the whole thing, not just the
   free-response items that happen to need a manual grade. Deliberately
   the same shape and spacing as .frq-block (this is a reference view, not
   a lesser one) but on --bg-alt so the two are still tellable apart at a
   glance -- which one has an input box to fill in isn't always obvious at
   this size. */
.auto-block{border:1px solid var(--line);border-radius:6px;padding:12px 14px;
  margin-bottom:12px;background:var(--bg-alt)}
.auto-block h3{margin:0 0 8px 0;font-size:14px}
.auto-block .answer-row .ans .pair-ok{color:var(--ok)}
.auto-block .answer-row .ans .pair-bad{color:var(--bad)}
.grading-scope-note{font-size:12px;color:var(--muted);margin:0 0 12px 0}
/* Deliberately distinct from the student answers below it: a grader
   scanning the block must never mistake the model answer for someone's
   submission. */
.expected{background:var(--bg-alt);border:1px solid var(--line);
  border-left:3px solid var(--ok);border-radius:4px;padding:7px 10px;
  margin:0 0 10px 0;font-size:13px}
.expected .lbl{display:block;font-size:10px;text-transform:uppercase;
  letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.expected .val{white-space:pre-wrap}
.expected .val.none{color:var(--muted);font-style:italic}
.answer-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line-soft)}
.answer-row:first-of-type{border-top:none}
.answer-row .student{flex:0 0 140px;font-weight:600;font-size:13px}
.answer-row .ans{flex:1;font-size:13px;white-space:pre-wrap}
/* Fixed 80px used to be narrower than the input itself once padding and
   border were counted, so the "/ max" had nowhere to sit and wrapped onto
   its own line. Sized to the real content now, and nowrap so it can never
   silently re-wrap if the max-points figure grows to two digits. */
.answer-row .pts{flex:0 0 190px;display:flex;align-items:center;
  justify-content:flex-end;gap:6px;white-space:nowrap}
.answer-row .pts input{width:56px;padding:3px 6px;border:1px solid var(--line);
  border-radius:4px;text-align:right}
.answer-row .pts .full-btn{padding:3px 8px;font-size:12px;line-height:1.3;
  border:1px solid var(--line);border-radius:4px;cursor:pointer}
.answer-row .pts .full-btn[disabled]{opacity:.45;cursor:default}
.answer-row .pts .max{color:var(--muted);font-size:12px}
.release-bar{display:flex;justify-content:space-between;align-items:center}
.msg{font-size:12px;margin-top:8px}
.msg.ok{color:var(--ok)}
.msg.err{color:var(--bad)}
</style></head>
<body>
<script>{{ common_js|safe }}</script>
<script>const HARD_DELETE = {{ "true" if hard_delete_enabled() else "false" }};</script>
<header>
  <h1>Grade · {{ event_name }}</h1>
  {% include "_user_badge.html" %}
</header>
<div class="wrap">

  <section>
    <div class="release-bar">
      <span id="grading_progress" class="muted">Loading…</span>
      <button id="release_btn" class="primary" disabled>Release grades</button>
    </div>
    <div id="release_msg" class="msg" style="display:none"></div>
  </section>

  <section>
    <p class="grading-scope-note">Every question is shown below for reference. Only free-response answers need a manual grade — everything else was graded automatically.</p>
    <div id="frq_list"></div>
  </section>

</div>
<script>
const ASSESSMENT_ID = {{ assessment_id|tojson }};
let SNAPSHOT = [], SNAPSHOT_FRQS = [], RESPONSES = {};

function esc(s){ return (s == null ? "" : String(s))
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

async function load(){
  const r = await fetch(`${APP_ROOT}/api/assessments/${ASSESSMENT_ID}/grading`);
  const j = await r.json();
  SNAPSHOT = j.snapshot || [];
  // Still the FRQ-only list -- updateProgress()'s completeness math and
  // the release gate are correctly scoped to just what needs a manual
  // grade, and must keep reading exactly this, unaffected by SNAPSHOT now
  // also carrying every other qtype for display.
  SNAPSHOT_FRQS = j.snapshot_frqs || [];
  RESPONSES = j.responses || {};
  render();
  updateProgress(j.grading_complete);
}

function updateProgress(complete){
  let graded = 0, total = 0;
  for(const [username, r] of Object.entries(RESPONSES)){
    if(!["submitted","auto_submitted_late"].includes(r.status)) continue;
    for(const q of SNAPSHOT_FRQS){
      total++;
      const g = r.manual_grade[String(q.number)];
      if(g && g.points_earned != null) graded++;
    }
  }
  document.getElementById("grading_progress").textContent = `${graded} / ${total} free-response answers graded`;
  const btn = document.getElementById("release_btn");
  btn.disabled = !complete || total === 0;
  btn.title = complete ? "" : "Every free-response answer must be graded first";
}

// Builds the "Your answer: X — correct answer: Y" (or per-pair breakdown
// for matching) summary for one student's answer to one auto-graded
// question. Mirrors assessment_results.html's student-facing wording
// exactly, so a coach reviewing the same data here isn't learning a
// second vocabulary for it.
function autoAnswerSummaryHTML(q, answer, autoGrade){
  const picked = answer ? answer.picked : null;
  if(q.qtype === "mcq"){
    const label = q.select_multiple ? "picks" : "answer";
    const correctLabel = q.select_multiple ? "answers (select all that apply)" : "answer";
    return `Your ${label}: <b>${esc(picked || "(none)")}</b> — correct ${correctLabel}: <b>${esc(q.correct_answer)}</b>`;
  }
  if(q.qtype === "tf"){
    return `Your answer: <b>${esc(picked || "(none)")}</b> — correct answer: <b>${esc(q.correct_answer)}</b>`;
  }
  if(q.qtype === "matching"){
    const pairs = (autoGrade && autoGrade.per_pair) || [];
    if(!pairs.length) return `<span class="muted">(no pairs answered)</span>`;
    return pairs.map(p => `<div class="${p.ok ? "pair-ok" : "pair-bad"}">${esc(p.label)} → ${esc(p.given || "(blank)")}`
      + `${p.ok ? "" : ` (correct: ${esc(p.expected)})`}</div>`).join("");
  }
  return `<span class="muted">(unrecognized question type)</span>`;
}

function render(){
  const root = document.getElementById("frq_list");
  if(!SNAPSHOT.length){ root.innerHTML = '<p class="muted">This assessment has no questions.</p>'; return; }
  const submittedEntries = () => Object.entries(RESPONSES)
    .filter(([, r]) => ["submitted","auto_submitted_late"].includes(r.status));

  root.innerHTML = SNAPSHOT.map(q => {
    if(q.qtype !== "frq"){
      // Read-only reference block -- see .auto-block above. Every other
      // qtype is auto-graded already; nothing here is editable or saved.
      const rows = submittedEntries().map(([username, r]) => {
        const answer = r.answers[String(q.number)];
        const ag = (r.auto_grade || {})[String(q.number)] || {};
        const ptsShown = ag.points_earned != null
          ? `${ag.points_earned} / ${ag.points_possible ?? q.max_points ?? 1}`
          : "—";
        return `
        <div class="answer-row">
          <span class="student">${esc(username)}</span>
          <span class="ans">${autoAnswerSummaryHTML(q, answer, ag)}</span>
          <span class="pts"><span class="max">${esc(ptsShown)}</span></span>
        </div>`;
      }).join("");
      return `
      <div class="auto-block">
        <h3>Q${esc(q.number)} <span class="muted" style="font-weight:400">(${q.max_points} pt · auto-graded)</span></h3>
        <p class="muted" style="font-size:12px">${esc(q.text)}</p>
        ${rows || '<p class="muted">No submissions yet.</p>'}
      </div>`;
    }
    const rows = submittedEntries()
      .map(([username, r]) => {
        const answer = r.answers[String(q.number)];
        const grade = r.manual_grade[String(q.number)];
        return `
        <div class="answer-row" data-username="${esc(username)}" data-number="${esc(q.number)}">
          <span class="student">${esc(username)}
            ${HARD_DELETE ? `<button type="button" class="ghost purge-resp-btn" title="Delete this student's response so they can retake the assessment" style="color:var(--bad);font-size:11px;padding:0 4px">&#128465;</button>` : ""}
          </span>
          <span class="ans">${esc(answer ? answer.text : "(no answer)")}</span>
          <span class="pts">
            <button type="button" class="ghost full-btn" data-max="${q.max_points}"
                    ${grade && grade.points_earned === q.max_points ? "disabled" : ""}
                    title="Mark correct — award the full ${q.max_points} pt${q.max_points === 1 ? "" : "s"}">✓ Full</button>
            <input type="number" min="0" max="${q.max_points}" step="0.5"
                   value="${grade ? grade.points_earned : ''}" class="grade-input">
            <span class="max">/ ${q.max_points}</span>
          </span>
        </div>`;
      }).join("");
    // The expected answer is what a grader marks against, so it belongs on
    // this page — it was in the payload (the snapshot carries
    // correct_answer for every FRQ) but was never rendered, leaving graders
    // to open the bank in another tab. Stated explicitly when absent, since
    // a blank box here is indistinguishable from a bug.
    const expected = (q.correct_answer || "").trim();
    return `
    <div class="frq-block">
      <h3>Q${esc(q.number)} <span class="muted" style="font-weight:400">(${q.max_points} pt)</span></h3>
      <p class="muted" style="font-size:12px">${esc(q.text)}</p>
      <div class="expected">
        <span class="lbl">Expected answer</span>
        ${expected
          ? `<span class="val">${esc(expected)}</span>`
          : `<span class="val none">No expected answer was recorded for this question — grade on the question text.</span>`}
      </div>
      ${rows || '<p class="muted">No submissions yet.</p>'}
    </div>`;
  }).join("");
  // One save path for both the number box and the ✓ Full button — two
  // copies of this fetch would be two places to keep in sync.
  async function saveGrade(row, points_earned){
    if(isNaN(points_earned)) return;
    const r = await fetch(`${APP_ROOT}/api/assessments/${ASSESSMENT_ID}/grading/${encodeURIComponent(row.dataset.username)}/${encodeURIComponent(row.dataset.number)}`, {
      method: "PATCH", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({points_earned}),
    });
    const j = await r.json();
    if(j.ok){
      toast("Saved.", "ok");
      await load();
    } else {
      toast("Failed: " + (j.error||""), "err");
    }
  }

  root.querySelectorAll(".grade-input").forEach(el => {
    el.addEventListener("change", () =>
      saveGrade(el.closest(".answer-row"), parseFloat(el.value)));
  });

  root.querySelectorAll(".purge-resp-btn").forEach(el => {
    el.addEventListener("click", async () => {
      const row = el.closest(".answer-row");
      const who = row.dataset.username;
      // Scoped to (test, student): the response is the only thing removed,
      // the test and everyone else's answers are untouched.
      if(await hardDelete("response", `${ASSESSMENT_ID}/${encodeURIComponent(who)}`,
                          `${who}'s response`)) await load();
    });
  });

  root.querySelectorAll(".full-btn").forEach(el => {
    el.addEventListener("click", () => {
      // Disable immediately: load() re-renders on success, but until it
      // does a double-click would fire a second identical PATCH.
      el.disabled = true;
      saveGrade(el.closest(".answer-row"), parseFloat(el.dataset.max));
    });
  });
}

document.getElementById("release_btn").addEventListener("click", async () => {
  if(!await confirmModal("Release grades? Students will immediately be able to see their full results for this test.")) return;
  const r = await fetch(`${APP_ROOT}/assessments/${ASSESSMENT_ID}/release-grades`, {method: "POST"});
  const j = await r.json();
  const msgEl = document.getElementById("release_msg");
  msgEl.style.display = "";
  if(j.ok){ msgEl.className = "msg ok"; msgEl.textContent = `Released to ${j.released_count} student(s).`; }
  else { msgEl.className = "msg err"; msgEl.textContent = j.error || "Failed"; }
});

load();
</script>
</body></html>
